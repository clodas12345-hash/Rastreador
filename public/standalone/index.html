<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Rastreador</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
</head>
<body>
  <header>
    <h1>📍 Rastreador</h1>
    <div id="statusBadge" class="status-badge offline">
      <span class="status-dot"></span> Parado
    </div>
  </header>

  <main>
    <!-- Tracker View -->
    <div id="viewTracker" class="card" style="display: flex; flex-direction: column; gap: 16px;">
      <div class="metrics-grid">
        <div class="metric-box">
          <div class="metric-label">Velocidade</div>
          <div id="speedEl" class="metric-value">0.0 km/h</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">Distância</div>
          <div id="distanceEl" class="metric-value">0.00 km</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">Tempo</div>
          <div id="timeEl" class="metric-value">00:00</div>
        </div>
        <div class="metric-box">
          <div class="metric-label">Latitude</div>
          <div id="latEl" class="metric-value" style="font-size: 0.9rem; margin-top: 8px;">0.00000</div>
        </div>
      </div>

      <div id="map"></div>
      <div style="display: none;"><span id="lngEl">0.00000</span></div>

      <button id="btnStart" class="btn btn-primary">▶ Iniciar Rastreamento</button>
      <button id="btnStop" class="btn btn-danger hidden">⏹ Parar e Salvar Trajeto</button>
    </div>

    <!-- History View -->
    <div id="viewHistory" class="card hidden">
      <h3 style="margin-bottom: 12px; font-size: 1rem; color: var(--text-main);">Histórico de Trajetos</h3>
      <div id="historyList" class="history-list">
        <!-- History items inserted dynamically -->
      </div>
    </div>
  </main>

  <nav class="bottom-nav">
    <button id="tabTracker" class="nav-item active">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M17.657 16.657L13.414 20.9a1.998 1.998 0 01-2.827 0l-4.244-4.243a8 8 0 1111.314 0z"></path><path stroke-linecap="round" stroke-linejoin="round" d="M15 11a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
      <span>Rastrear</span>
    </button>
    <button id="tabHistory" class="nav-item">
      <svg fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path></svg>
      <span>Histórico</span>
    </button>
  </nav>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="./app.js"></script>
</body>
</html>
