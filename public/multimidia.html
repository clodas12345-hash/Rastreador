<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>GKD Mobility - Central Multimídia do Carro</title>
  
  <!-- Leaflet CSS -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body, html { width: 100%; height: 100%; overflow: hidden; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; background: #0f172a; color: #fff; }
    #map { width: 100%; height: 100%; z-index: 1; }

    /* Automotive HUD Top Bar */
    .hud-top {
      position: absolute;
      top: 12px;
      left: 12px;
      right: 12px;
      z-index: 1000;
      background: rgba(15, 23, 42, 0.92);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(51, 65, 85, 0.8);
      border-radius: 18px;
      padding: 8px 14px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      box-shadow: 0 10px 25px rgba(0,0,0,0.5);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .brand-icon {
      font-size: 20px;
      background: rgba(37, 99, 235, 0.25);
      border: 1px solid rgba(59, 130, 246, 0.4);
      width: 36px;
      height: 36px;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .brand-text {
      display: flex;
      flex-direction: column;
    }
    .brand-title {
      font-size: 13px;
      font-weight: 900;
      letter-spacing: -0.3px;
      color: #fff;
    }
    .brand-sub {
      font-size: 10px;
      color: #34d399;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 4px;
    }
    .pulse-dot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 1.5s infinite;
    }

    .car-pills {
      display: flex;
      gap: 8px;
      overflow-x: auto;
    }
    .car-pill {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid #334155;
      padding: 6px 12px;
      border-radius: 12px;
      color: #cbd5e1;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s;
      white-space: nowrap;
    }
    .car-pill.active {
      background: #2563eb;
      color: #fff;
      border-color: #60a5fa;
      box-shadow: 0 0 12px rgba(37, 99, 235, 0.6);
      transform: scale(1.03);
    }
    .car-pill:active { transform: scale(0.96); }
    .speed-badge {
      font-family: monospace;
      font-size: 10px;
      background: rgba(0,0,0,0.3);
      padding: 2px 5px;
      border-radius: 6px;
    }

    .btn-fs {
      background: #1e293b;
      border: 1px solid #334155;
      color: #f8fafc;
      padding: 6px 12px;
      border-radius: 12px;
      font-size: 11px;
      font-weight: 700;
      cursor: pointer;
    }

    /* Floating Center Button (User's Exact 3-Step Cycle) */
    .center-btn-wrap {
      position: absolute;
      bottom: 24px;
      right: 20px;
      z-index: 1000;
    }
    .center-btn {
      background: rgba(255, 255, 255, 0.98);
      color: #1e293b;
      border: 1px solid #93c5fd;
      padding: 12px 18px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 900;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 12px 25px rgba(0,0,0,0.35);
      transition: all 0.2s;
    }
    .center-btn:active { transform: scale(0.95); }

    /* Custom Leaflet Marker Styling */
    .vehicle-marker {
      display: flex;
      flex-direction: column;
      align-items: center;
      transition: transform 0.3s;
    }
    .marker-bubble {
      background: #fff;
      border: 3px solid #2563eb;
      border-radius: 50%;
      width: 44px;
      height: 44px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 6px 16px rgba(0,0,0,0.4);
      position: relative;
    }
    .marker-bubble.moving {
      border-color: #10b981;
    }
    .marker-label {
      background: rgba(15, 23, 42, 0.9);
      color: #fff;
      font-size: 11px;
      font-weight: 800;
      padding: 2px 8px;
      border-radius: 8px;
      margin-top: 4px;
      white-space: nowrap;
      box-shadow: 0 4px 10px rgba(0,0,0,0.5);
      border: 1px solid rgba(255,255,255,0.2);
    }

    @keyframes pulse {
      0% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(1.3); }
      100% { opacity: 1; transform: scale(1); }
    }
  </style>
</head>
<body>

  <!-- Top In-Dash HUD -->
  <div class="hud-top">
    <div class="brand">
      <div class="brand-icon">🚗</div>
      <div class="brand-text">
        <span class="brand-title">GKD Mobility</span>
        <span class="brand-sub"><span class="pulse-dot"></span> Multimídia ao Vivo</span>
      </div>
    </div>

    <div class="car-pills" id="carPills">
      <!-- Injected dynamically -->
    </div>

    <button class="btn-fs" onclick="toggleFullscreen()">⛶ Tela Cheia</button>
  </div>

  <!-- Map Container -->
  <div id="map"></div>

  <!-- Bottom 3-Step Center Button -->
  <div class="center-btn-wrap">
    <button class="center-btn" id="btnCenter" onclick="cycleCenter()">
      <span>🎯</span> <span id="lblCenter">Carregando carros...</span>
    </button>
  </div>

  <!-- Leaflet JS -->
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  
  <script>
    const FLESPI_TOKEN = 'DYX74VMw3KdUUbFwued9qa2ahQcAZcts9C7MVZ32gw2GEJSfgeCMk1Ww2oc1MofV';

    // Vehicles definition with default high-quality vehicle photos
    let allVehicles = [
      { 
        id: 'peugeot-208', 
        name: 'Peugeot 208', 
        imei: '868166057692857', 
        lat: -23.553282, 
        lng: -46.65841, 
        speed: 0, 
        status: 'IgnitionOff',
        photoUrl: 'https://images.unsplash.com/photo-1541899481282-d53bffe3c35d?w=300&auto=format&fit=crop&q=80',
        licensePlate: 'SWU-4D27'
      },
      { 
        id: 'onix-plus', 
        name: 'Onix Plus', 
        imei: '868166052523461', 
        lat: -23.512503, 
        lng: -46.519462, 
        speed: 0, 
        status: 'IgnitionOff',
        photoUrl: 'https://images.unsplash.com/photo-1552519507-da3b142c6e3d?w=300&auto=format&fit=crop&q=80',
        licensePlate: 'TDD-5I76'
      }
    ];

    // Load locally cached photos from localStorage if available
    try {
      const cachedPhotos = JSON.parse(localStorage.getItem('gkd_multimidia_photos') || '{}');
      if (cachedPhotos && typeof cachedPhotos === 'object') {
        allVehicles = allVehicles.map(v => ({
          ...v,
          photoUrl: cachedPhotos[v.id] || cachedPhotos[v.imei] || v.photoUrl
        }));
      }
    } catch {}

    const urlParams = new URLSearchParams(window.location.search);
    const paramImei = urlParams.get('imei');
    const paramV = urlParams.get('v') || urlParams.get('vehicleId');
    const paramPhoto = urlParams.get('photo') || urlParams.get('p') || urlParams.get('photoUrl');

    if (paramPhoto && (paramV || paramImei)) {
      allVehicles = allVehicles.map(v => {
        if ((paramV && (v.id === paramV || paramV.includes(v.id))) || (paramImei && v.imei === paramImei)) {
          return { ...v, photoUrl: paramPhoto };
        }
        return v;
      });
      try {
        const currentCache = JSON.parse(localStorage.getItem('gkd_multimidia_photos') || '{}');
        if (paramV) currentCache[paramV] = paramPhoto;
        if (paramImei) currentCache[paramImei] = paramPhoto;
        localStorage.setItem('gkd_multimidia_photos', JSON.stringify(currentCache));
      } catch {}
    }
    
    let vehicles = allVehicles;
    function filterVehicles() {
      const singleMatched = (paramImei || paramV)
        ? allVehicles.filter(v => (paramImei && v.imei === paramImei) || (paramV && (v.id === paramV || paramV.includes(v.id))))
        : [];
      vehicles = singleMatched.length > 0 ? singleMatched : allVehicles;
    }
    filterVehicles();

    // Fetch synced fleet profiles (/api/fleet-sync) to get latest phone-uploaded photos
    async function syncRemoteFleetPhotos() {
      try {
        const res = await fetch('/api/fleet-sync');
        if (res.ok) {
          const data = await res.json();
          const remoteList = Array.isArray(data?.vehicles) ? data.vehicles : [];
          if (remoteList.length > 0) {
            const photoCache = {};
            allVehicles = allVehicles.map(v => {
              const match = remoteList.find(r => (r.id && r.id === v.id) || (r.trackerNumber && v.imei && String(r.trackerNumber) === String(v.imei)));
              if (match) {
                const updatedPhoto = match.photoUrl || v.photoUrl;
                photoCache[v.id] = updatedPhoto;
                photoCache[v.imei] = updatedPhoto;
                return {
                  ...v,
                  name: match.name || v.name,
                  licensePlate: match.licensePlate || v.licensePlate,
                  photoUrl: updatedPhoto
                };
              }
              photoCache[v.id] = v.photoUrl;
              photoCache[v.imei] = v.photoUrl;
              return v;
            });
            try {
              localStorage.setItem('gkd_multimidia_photos', JSON.stringify(photoCache));
            } catch {}
            filterVehicles();
            updateVehiclesUI();
          }
        }
      } catch {}
    }

    let cycleStep = 0; // 0 = Car 1, 1 = Car 2, 2 = Centralizar os dois
    let map;
    let markers = {};

    function initMap() {
      const initialLat = vehicles[0] ? vehicles[0].lat : -23.518;
      const initialLng = vehicles[0] ? vehicles[0].lng : -46.553;
      const initialZoom = vehicles.length === 1 ? 16 : 14;
      // Dark / Night navigation tiles ideal for in-car dashboard
      map = L.map('map', { zoomControl: false }).setView([initialLat, initialLng], initialZoom);
      L.tileLayer('https://{s}.basemaps.cartocdn.com/rastertiles/voyager/{z}/{x}/{y}{r}.png', {
        maxZoom: 19,
        attribution: '© OpenStreetMap, © CARTO'
      }).addTo(map);

      updateVehiclesUI();
      pollFlespiTelemetry();
      syncRemoteFleetPhotos();
      setInterval(pollFlespiTelemetry, 3500);
      setInterval(syncRemoteFleetPhotos, 10000);
    }

    function createCustomIcon(v, speed, isMoving) {
      const contentHtml = v.photoUrl
        ? `<img src="${v.photoUrl}" alt="${v.name}" style="width:100%;height:100%;object-fit:cover;border-radius:50%;" />`
        : `<span style="font-size: 22px;">🚘</span>`;

      const iconHtml = `
        <div class="vehicle-marker">
          <div class="marker-bubble ${isMoving ? 'moving' : ''}" style="width:44px;height:44px;border-radius:50%;overflow:hidden;border:3px solid ${isMoving ? '#10b981' : '#2563eb'};background:#fff;display:flex;align-items:center;justify-content:center;box-shadow:0 6px 16px rgba(0,0,0,0.4);">
            ${contentHtml}
          </div>
          <div class="marker-label">${v.name} (${speed} km/h)</div>
        </div>
      `;
      return L.divIcon({
        className: 'custom-div-icon',
        html: iconHtml,
        iconSize: [44, 70],
        iconAnchor: [22, 50]
      });
    }

    function updateVehiclesUI() {
      // Update markers on map
      vehicles.forEach(v => {
        const isMoving = v.speed >= 4;
        const icon = createCustomIcon(v, Math.round(v.speed), isMoving);
        if (markers[v.id]) {
          markers[v.id].setLatLng([v.lat, v.lng]);
          markers[v.id].setIcon(icon);
        } else {
          markers[v.id] = L.marker([v.lat, v.lng], { icon: icon }).addTo(map);
          markers[v.id].on('click', () => {
            map.flyTo([v.lat, v.lng], 17);
          });
        }
      });

      // Update HUD Pills
      const pillsContainer = document.getElementById('carPills');
      pillsContainer.innerHTML = vehicles.map(v => `
        <button class="car-pill" onclick="focusVehicle('${v.id}')">
          <span>${v.speed >= 4 ? '🟢' : '⚪'}</span>
          <span>${v.name}</span>
          <span class="speed-badge">${Math.round(v.speed)} km/h</span>
        </button>
      `).join('') + (vehicles.length > 1 ? `
        <button class="car-pill" onclick="fitAll()">
          <span>🗺️</span> <span>Ambos</span>
        </button>
      ` : '');

      updateCenterButtonLabel();
    }

    function updateCenterButtonLabel() {
      const lbl = document.getElementById('lblCenter');
      if (vehicles.length === 1) {
        lbl.innerText = `Centralizar (${vehicles[0].name})`;
        return;
      }
      if (cycleStep === 0) {
        lbl.innerText = `Centralizar (${vehicles[0].name})`;
      } else if (cycleStep === 1 && vehicles[1]) {
        lbl.innerText = `Centralizar (${vehicles[1].name})`;
      } else {
        lbl.innerText = 'Centralizar os dois';
      }
    }

    function cycleCenter() {
      if (vehicles.length === 1) {
        focusVehicle(vehicles[0].id);
        return;
      }
      if (cycleStep === 0) {
        // Focus Car 1
        focusVehicle(vehicles[0].id);
        cycleStep = 1;
      } else if (cycleStep === 1 && vehicles[1]) {
        // Focus Car 2
        focusVehicle(vehicles[1].id);
        cycleStep = 2;
      } else {
        // Focus Both
        fitAll();
        cycleStep = 0;
      }
      updateCenterButtonLabel();
    }

    function focusVehicle(id) {
      const v = vehicles.find(veh => veh.id === id);
      if (v) {
        map.flyTo([v.lat, v.lng], 17, { duration: 1 });
      }
    }

    function fitAll() {
      const group = new L.featureGroup(Object.values(markers));
      map.fitBounds(group.getBounds().pad(0.2));
    }

    async function pollFlespiTelemetry() {
      try {
        const res = await fetch('https://flespi.io/gw/devices/all/telemetry/position.latitude,position.longitude,position.speed,ident,engine.ignition.status', {
          headers: { 'Authorization': `FlespiToken ${FLESPI_TOKEN}` }
        });
        const data = await res.json();
        if (data && data.result) {
          data.result.forEach(dev => {
            const imei = String(dev.telemetry?.ident?.value || '');
            const lat = Number(dev.telemetry?.['position.latitude']?.value);
            const lng = Number(dev.telemetry?.['position.longitude']?.value);
            const speed = Number(dev.telemetry?.['position.speed']?.value || 0);
            
            const matched = vehicles.find(v => v.imei === imei || dev.name?.includes(v.name));
            if (matched && !isNaN(lat) && !isNaN(lng) && lat !== 0 && lng !== 0) {
              matched.lat = lat;
              matched.lng = lng;
              matched.speed = speed;
            }
          });
          updateVehiclesUI();
        }
      } catch (e) {
        console.warn('Telemetry update poll:', e);
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    window.onload = initMap;
  </script>
</body>
</html>
